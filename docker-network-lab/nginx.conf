upstream python_backends {
    zone python_backends 64k;
    server 10.67.20.11:3001 max_fails=1 fail_timeout=5s;
    server 10.67.20.12:3002 max_fails=1 fail_timeout=5s;
}
server {
    listen 80;
    server_name app.subspace-67.test api.subspace-67.test;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name app.subspace-67.test api.subspace-67.test;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://python_backends;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        add_header X-Edge $server_addr always;
    }
}
