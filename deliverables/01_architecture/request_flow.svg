<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="request flow for https://app.subspace-67.test/api/status">
<style>
  .bg{fill:#ffffff} .ink{fill:#1d2330} .muted{fill:#5b6475} .line{stroke:#8a93a6}
  .box{fill:#f6f8fb;stroke:#c9d1de} .bus{fill:#e8eef8;stroke:#9fb3d6}
  .dns{fill:#7a4bd1} .edge{fill:#0f7b6c} .be{fill:#c25e00} .cli{fill:#2f6fd6} .net{fill:#6b7385}
  .s-dns{stroke:#7a4bd1} .s-edge{stroke:#0f7b6c} .s-be{stroke:#c25e00} .s-cli{stroke:#2f6fd6}
  .chip{fill:#eef1f6} .lbl{fill:#ffffff}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  @media (prefers-color-scheme: dark){
    .bg{fill:#14171d} .ink{fill:#e6e9ef} .muted{fill:#9aa3b5} .line{stroke:#5d6679}
    .box{fill:#1c2029;stroke:#343b4a} .bus{fill:#1b2536;stroke:#34507e}
    .dns{fill:#a57cf0} .edge{fill:#3fbfa8} .be{fill:#f0913a} .cli{fill:#6aa0f5} .net{fill:#8d95a8}
    .s-dns{stroke:#a57cf0} .s-edge{stroke:#3fbfa8} .s-be{stroke:#f0913a} .s-cli{stroke:#6aa0f5}
    .chip{fill:#252b37} .lbl{fill:#14171d}
  }
</style>
<rect class="bg" width="1200" height="900"/>
<defs><marker id="ah-cli" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="cli"/></marker><marker id="ah-dns" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dns"/></marker><marker id="ah-edge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="edge"/></marker><marker id="ah-be" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="be"/></marker></defs>
<text x="40" y="40" class="ink" font-size="22" text-anchor="start" font-weight="700">One request to https://app.subspace-67.test/api/status, layer by layer</text>
<text x="40" y="64" class="muted" font-size="13" text-anchor="start" font-weight="normal">Time flows downwards. Right column: the layer that step belongs to (OSI / TCP-IP).</text>
<rect class="box" x="25" y="84" width="190" height="46" rx="9"/>
<rect class="cli" x="25" y="84" width="190" height="5" rx="2"/>
<text x="120" y="106" class="ink" font-size="14" text-anchor="middle" font-weight="700">Client</text>
<text x="120" y="123" class="muted mono" font-size="11" text-anchor="middle" font-weight="normal">any Mac (main: mac_abhay)</text>
<line class="line" x1="120" y1="130" x2="120" y2="760" stroke-width="1.5" stroke-dasharray="4 5"/>
<rect class="box" x="250" y="84" width="190" height="46" rx="9"/>
<rect class="dns" x="250" y="84" width="190" height="5" rx="2"/>
<text x="345" y="106" class="ink" font-size="14" text-anchor="middle" font-weight="700">DNS server</text>
<text x="345" y="123" class="muted mono" font-size="11" text-anchor="middle" font-weight="normal">mac_vachan 10.7.23.136:53</text>
<line class="line" x1="345" y1="130" x2="345" y2="760" stroke-width="1.5" stroke-dasharray="4 5"/>
<rect class="box" x="490" y="84" width="190" height="46" rx="9"/>
<rect class="edge" x="490" y="84" width="190" height="5" rx="2"/>
<text x="585" y="106" class="ink" font-size="14" text-anchor="middle" font-weight="700">Edge (nginx)</text>
<text x="585" y="123" class="muted mono" font-size="11" text-anchor="middle" font-weight="normal">mac_aanya 10.7.19.193:443</text>
<line class="line" x1="585" y1="130" x2="585" y2="760" stroke-width="1.5" stroke-dasharray="4 5"/>
<rect class="box" x="720" y="84" width="190" height="46" rx="9"/>
<rect class="be" x="720" y="84" width="190" height="5" rx="2"/>
<text x="815" y="106" class="ink" font-size="14" text-anchor="middle" font-weight="700">Backend A or B</text>
<text x="815" y="123" class="muted mono" font-size="11" text-anchor="middle" font-weight="normal">10.7.1.136:3001 / 10.7.23.136:3002</text>
<line class="line" x1="815" y1="130" x2="815" y2="760" stroke-width="1.5" stroke-dasharray="4 5"/>
<text x="1080" y="106" class="ink" font-size="14" text-anchor="middle" font-weight="700">Layer</text>
<text x="22" y="148" class="muted" font-size="11" text-anchor="start" font-weight="600">1 · name -&gt; address</text>
<line class="s-cli" x1="126" y1="170" x2="339" y2="170" stroke-width="2.2" marker-end="url(#ah-cli)"/>
<rect class="lbl" x="45.0" y="149" width="375" height="16" rx="3"/>
<text x="232.5" y="162" class="ink" font-size="11.5" text-anchor="middle" font-weight="normal">DNS query  A? app.subspace-67.test   (ephemeral port -&gt; 53)</text>
<text x="1080" y="174" class="muted" font-size="11" text-anchor="middle" font-weight="normal">L7 DNS · L4 UDP · L3 IP</text>
<line class="s-dns" x1="339" y1="220" x2="126" y2="220" stroke-width="2.2" marker-end="url(#ah-dns)"/>
<rect class="lbl" x="59.099999999999994" y="199" width="346.8" height="16" rx="3"/>
<text x="232.5" y="212" class="ink" font-size="11.5" text-anchor="middle" font-weight="normal">answer  10.7.19.193   TTL 60, flag aa (our own zone)</text>
<text x="1080" y="224" class="muted" font-size="11" text-anchor="middle" font-weight="normal">L7 DNS · L4 UDP</text>
<text x="22" y="248" class="muted" font-size="11" text-anchor="start" font-weight="600">2 · TCP 3-way handshake</text>
<line class="s-cli" x1="126" y1="270" x2="579" y2="270" stroke-width="2.2" marker-end="url(#ah-cli)"/>
<rect class="lbl" x="230.3" y="249" width="244.4" height="16" rx="3"/>
<text x="352.5" y="262" class="ink" font-size="11.5" text-anchor="middle" font-weight="normal">SYN   (ephemeral port -&gt; 443, seq x)</text>
<text x="1080" y="274" class="muted" font-size="11" text-anchor="middle" font-weight="normal">L4 TCP</text>
<line class="s-edge" x1="579" y1="320" x2="126" y2="320" stroke-width="2.2" marker-end="url(#ah-edge)"/>
<rect class="lbl" x="262.3" y="299" width="180.4" height="16" rx="3"/>
<text x="352.5" y="312" class="ink" font-size="11.5" text-anchor="middle" font-weight="normal">SYN-ACK   (seq y, ack x+1)</text>
<text x="1080" y="324" class="muted" font-size="11" text-anchor="middle" font-weight="normal">L4 TCP</text>
<line class="s-cli" x1="126" y1="370" x2="579" y2="370" stroke-width="2.2" marker-end="url(#ah-cli)"/>
<rect class="lbl" x="214.29999999999998" y="349" width="276.40000000000003" height="16" rx="3"/>
<text x="352.5" y="362" class="ink" font-size="11.5" text-anchor="middle" font-weight="normal">ACK   (ack y+1) -&gt; connection established</text>
<text x="1080" y="374" class="muted" font-size="11" text-anchor="middle" font-weight="normal">L4 TCP</text>
<text x="22" y="398" class="muted" font-size="11" text-anchor="start" font-weight="600">3 · TLS handshake</text>
<line class="s-cli" x1="126" y1="420" x2="579" y2="420" stroke-width="2.2" marker-end="url(#ah-cli)"/>
<rect class="lbl" x="195.1" y="399" width="314.8" height="16" rx="3"/>
<text x="352.5" y="412" class="ink" font-size="11.5" text-anchor="middle" font-weight="normal">ClientHello   SNI app.subspace-67.test, ALPN h2</text>
<text x="1080" y="424" class="muted" font-size="11" text-anchor="middle" font-weight="normal">TLS (OSI L5-6 · TCP/IP application)</text>
<line class="s-edge" x1="579" y1="470" x2="126" y2="470" stroke-width="2.2" marker-end="url(#ah-edge)"/>
<rect class="lbl" x="175.89999999999998" y="449" width="353.20000000000005" height="16" rx="3"/>
<text x="352.5" y="462" class="ink" font-size="11.5" text-anchor="middle" font-weight="normal">ServerHello, Certificate (signed by our CA), Finished</text>
<text x="1080" y="474" class="muted" font-size="11" text-anchor="middle" font-weight="normal">TLS</text>
<line class="s-cli" x1="126" y1="520" x2="579" y2="520" stroke-width="2.2" marker-end="url(#ah-cli)"/>
<rect class="lbl" x="156.7" y="499" width="391.6" height="16" rx="3"/>
<text x="352.5" y="512" class="ink" font-size="11.5" text-anchor="middle" font-weight="normal">Finished -&gt; keys agreed; everything after this is encrypted</text>
<text x="1080" y="524" class="muted" font-size="11" text-anchor="middle" font-weight="normal">TLS</text>
<text x="22" y="548" class="muted" font-size="11" text-anchor="start" font-weight="600">4 · HTTP request</text>
<line class="s-cli" x1="126" y1="570" x2="579" y2="570" stroke-width="2.2" marker-end="url(#ah-cli)"/>
<rect class="lbl" x="227.1" y="549" width="250.8" height="16" rx="3"/>
<text x="352.5" y="562" class="ink" font-size="11.5" text-anchor="middle" font-weight="normal">GET /api/status   (HTTP/2 inside TLS)</text>
<text x="1080" y="574" class="muted" font-size="11" text-anchor="middle" font-weight="normal">L7 HTTP over TLS over TCP</text>
<text x="22" y="598" class="muted" font-size="11" text-anchor="start" font-weight="600">5 · load balancing</text>
<line class="s-edge" x1="591" y1="620" x2="809" y2="620" stroke-width="2.2" marker-end="url(#ah-edge)"/>
<rect class="lbl" x="510.0" y="599" width="380" height="16" rx="3"/>
<text x="700.0" y="612" class="ink" font-size="11.5" text-anchor="middle" font-weight="normal">round robin: GET /api/status HTTP/1.1 + X-Forwarded-For (plain, LAN)</text>
<text x="1080" y="624" class="muted" font-size="11" text-anchor="middle" font-weight="normal">L7 reverse proxy / load balancer</text>
<line class="s-be" x1="809" y1="670" x2="591" y2="670" stroke-width="2.2" marker-end="url(#ah-be)"/>
<rect class="lbl" x="536.2" y="649" width="327.6" height="16" rx="3"/>
<text x="700.0" y="662" class="ink" font-size="11.5" text-anchor="middle" font-weight="normal">200 OK   X-Backend: A|B   Cache-Control: no-store</text>
<text x="1080" y="674" class="muted" font-size="11" text-anchor="middle" font-weight="normal">L7 HTTP · L4 TCP</text>
<text x="22" y="698" class="muted" font-size="11" text-anchor="start" font-weight="600">6 · response</text>
<line class="s-edge" x1="579" y1="720" x2="126" y2="720" stroke-width="2.2" marker-end="url(#ah-edge)"/>
<rect class="lbl" x="140.7" y="699" width="423.6" height="16" rx="3"/>
<text x="352.5" y="712" class="ink" font-size="11.5" text-anchor="middle" font-weight="normal">HTTP/2 200 (encrypted)   X-Backend shows which backend served it</text>
<text x="1080" y="724" class="muted" font-size="11" text-anchor="middle" font-weight="normal">L7 HTTP over TLS</text>
<text x="40" y="792" class="ink" font-size="12.5" text-anchor="start" font-weight="normal">Under every step: L3 IPv4 packets between 10.7.x.x addresses; L2 Wi-Fi frames between MAC addresses (found with ARP); L1 radio.</text>
<text x="40" y="814" class="ink" font-size="12.5" text-anchor="start" font-weight="normal">TLS ends at the edge: client -&gt; edge is encrypted, edge -&gt; backend is plain HTTP on the LAN (the edge re-opens a separate TCP connection to the backend).</text>
<text x="40" y="836" class="muted" font-size="12" text-anchor="start" font-weight="normal">Failure demos: F1/F2 break step 1, F5 breaks step 2 (wrong port -&gt; RST), F3/F4 break step 5 (F4: TLS still completes, then the edge answers 502).</text>
</svg>