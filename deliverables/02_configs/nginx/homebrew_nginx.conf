# Homebrew nginx main config, reduced for subspace_67 by scripts/gen_nginx_conf.py.
# The original is saved next to it as nginx.conf.orig_subspace67 (restore_network.sh puts it back).
worker_processes  auto;
error_log  /Users/aanyamehrotra/Desktop/CN_subspace_67/logs/nginx_error.log  notice;
pid        /Users/aanyamehrotra/Desktop/CN_subspace_67/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    include /Users/aanyamehrotra/Desktop/CN_subspace_67/configs/nginx_subspace_67.conf;
}
